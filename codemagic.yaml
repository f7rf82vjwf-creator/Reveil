workflows:
  ios-unsigned-build:
    name: Reveil iOS Unsigned Build
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      xcode: latest

    scripts:

      - name: Check Xcode project
        script: |
          set -e

          echo "=== Xcode version ==="
          xcodebuild -version

          echo "=== Project ==="
          ls -la "$CM_BUILD_DIR"

          echo "=== Schemes ==="
          xcodebuild \
            -project "$CM_BUILD_DIR/Reveil.xcodeproj" \
            -list

      - name: Check build settings
        script: |
          set -e

          xcodebuild \
            -project "$CM_BUILD_DIR/Reveil.xcodeproj" \
            -scheme "Reveil" \
            -showBuildSettings

      - name: Build Reveil without code signing
        script: |
          set -e

          mkdir -p "$CM_BUILD_DIR/build/ios"

          xcodebuild \
            -project "$CM_BUILD_DIR/Reveil.xcodeproj" \
            -scheme "Reveil" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

    artifacts:
      - "$CM_BUILD_DIR/build/ios/**/*.app"
      - "$HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app"
      - "/tmp/xcodebuild_logs/*.log"